<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Swinsoft Consulting</title>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link href="Style.css" rel="stylesheet"/>

        <!-- Bootstrap CSS -->
        <link href="Framework/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Catalogue styles for better product card display -->
        <style>
            /* Product Grid */
            .products-grid { 
                display: grid; 
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
                gap: 25px; 
                margin-bottom: 30px;
                padding: 20px;
            }
            
            /* Product Card - Flex layout to handle different content sizes */
            .product-card { 
                border: 1px solid #e0e0e0; 
                border-radius: 8px; 
                overflow: hidden;
                background-color: white; 
                box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                display: flex;
                flex-direction: column;
                height: 100%;
            }
            
            .product-card:hover { 
                transform: translateY(-6px); 
                box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            }
            
            /* Product Image - Fixed height to handle inconsistent sizes */
            .product-image { 
                width: 100%; 
                height: 200px; 
                object-fit: cover;
                object-position: center;
                background-color: #f5f5f5;
                display: block;
            }
            
            /* Card Body - Flex to push button to bottom */
            .product-card-body {
                display: flex;
                flex-direction: column;
                flex: 1;
                padding: 16px;
            }
            
            .product-name { 
                font-size: 16px; 
                font-weight: 700; 
                margin: 0 0 8px 0; 
                color: #222;
                line-height: 1.3;
            }
            
            .product-description { 
                font-size: 13px; 
                color: #666; 
                margin: 0 0 12px 0; 
                flex-grow: 1;
                line-height: 1.4;
            }
            
            .product-info {
                margin: 10px 0;
                font-size: 13px;
            }
            
            .product-info strong {
                color: #333;
            }
            
            .product-price { 
                font-size: 18px; 
                font-weight: 700; 
                color: #28a745; 
                margin: 8px 0;
            }
            
            .product-stock {
                font-size: 12px;
                margin: 4px 0;
                font-weight: 600;
            }
            
            .stock-in { 
                color: #28a745;
            }
            
            .stock-out { 
                color: #dc3545;
            }
            
            .product-supplier {
                font-size: 11px;
                color: #999;
                margin: 4px 0 12px 0;
            }
            
            /* Button at bottom */
            .product-actions { 
                margin-top: auto;
                padding-top: 12px;
                border-top: 1px solid #f0f0f0;
            }
            
            .btn-add-cart { 
                width: 100%;
                padding: 10px; 
                background-color: #007bff; 
                color: white; 
                border: none; 
                border-radius: 4px; 
                cursor: pointer; 
                font-size: 13px;
                font-weight: 600;
                transition: background-color 0.2s ease;
            }
            
            .btn-add-cart:hover:not(:disabled) { 
                background-color: #0056b3;
            }
            
            .btn-add-cart:disabled { 
                background-color: #ccc; 
                cursor: not-allowed;
                opacity: 0.7;
            }
            
            .no-results { 
                text-align: center; 
                padding: 40px; 
                color: #666; 
                font-size: 16px; 
            }
        </style>
    </head>

    <body class="Font">
        <!-- Header waves -->
        <div class="Curve">
            <svg viewBox="0 0 500 150" preserveAspectRatio="none">
                <!-- Third wave [Furthest back] -->
                <path d="M-50,0 L500,0 L500,60 L-50,60 Z" class="wave-back"></path>
                <!-- Second wave -->
                <path d="M500,0 C350,150 150,-100 0,50 L0,0 L500,0 Z" class="wave-middle"></path>
                <!-- First wave [Furthest forward]-->
                <path d="M0,0 C150,150 350,-100 500,50 L500,0 L0,0 Z" class="wave-front"></path>
            </svg>
        </div>

        <button type="button" class="btn btn-primary" style="float: right;">LogIn</button>
        <strong><h1 style="padding-left: 55px;">Swinsoft Consulting</h1></strong>

        <!-- THANG'S IMPLEMENTATION: Navigation Links for Item Management -->
        <div style="padding: 10px 55px; background-color: #f8f9fa; border-bottom: 2px solid #dee2e6; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <a href="item-management.html" style="color: #dc3545; text-decoration: none; margin-right: 20px; font-weight: bold;">Manage Items (Admin)</a>
                <span style="color: #666; margin-left: 20px; border-left: 1px solid #ddd; padding-left: 20px;">New features: Manage inventory which will be used for admin accounts</span>
            </div>
            <button id="resetButtonIndex" style="padding: 8px 15px; background-color: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap;">Reset to Database</button>
        </div>

        <div class="container-fluid text-center" style="padding-top: 30px">
            <!-- Filtering, search bar and shopping cart -->
            <div class="row">
                <div class="col-sm-12 col-md-4 col-lg-4 text-md-start text-center">
                    <strong><p style="font-size: 25px;">Filters</p></strong>

                    <div class="row">
                        <div class="col-6">
                        <label for="Type">Type:</label>
                        </div>
                        <div class="col-6">
                        <select name="Type" id="Type">
                            <option value="">All Types</option>
                        </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6">
                        <label for="Category">Category:</label>
                        </div>
                        <div class="col-6">
                        <select name="Category" id="Category">
                            <option value="Eg1">Eg1</option>
                            <option value="Eg2">Eg2</option>
                        </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6">
                        <label for="Price">Price:</label>
                        </div>
                        <div class="col-6">
                        <select name="Price" id="Price">
                            <option value="Eg1">Eg1</option>
                            <option value="Eg2">Eg2</option>
                        </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6">
                        <label for="Availability">Availability:</label>
                        </div>
                        <div class="col-6">
                        <select name="Availability" id="Availability">
                            <option value="">All Items</option>
                            <option value="inStock">In Stock</option>
                            <option value="outOfStock">Out of Stock</option>
                        </select>
                        </div>
                    </div>
                </div>

                <div class="col-sm-12 col-md-4 col-lg-4 text-center">
                    <strong><p style="font-size: 25px;">Search for items</p></strong>
                    <input type="text" id="searchKeyword" placeholder="Search..">
                </div>

                <div class="col-sm-12 col-md-4 col-lg-4 text-md-end text-center">
                    <button type="button" class="btn btn-primary">Shopping Cart</button>
                </div>
            </div>

            <!-- Store Catalogue -->
            <div class="row">
                <div class="col-12 text-center">
                    <br>
                    <hr><h2><strong>Store Catalogue</strong></h2><hr>

                    <!-- Products grid integrated from catalogue (display only) -->
                    <div style="margin: 20px 0; text-align: left;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h4 style="margin:0">Available Products</h4>
                        </div>
                    </div>

                    <!-- Products container (populated by script) -->
                    <div id="productsContainer" class="products-grid" style="width:100%;"></div>
                </div>
            </div>
        </div>

        <!-- JS files required for catalogue display -->
        <script src="Backend/Product.js"></script>
        <script src="Backend/InventoryManager.js"></script>
        <script src="Backend/Database.js"></script>
        <script src="Backend/StoreCatalogue.js"></script>

        <script>
            // Global variables for filtering/searching
            let globalCatalogue = null;
            let globalAllProducts = [];

            // Initialize catalogue with data from localStorage or Database.json
            document.addEventListener('DOMContentLoaded', () => {
                const ProductList = document.getElementById('productsContainer');

                // Load products with proper synchronization
                loadProductsWithSync();

                function loadProductsWithSync() {
                    // PRIORITY 1: Check localStorage for admin changes (from item-management.html)
                    const cachedData = localStorage.getItem('store_database');
                    
                    if (cachedData) {
                        try {
                            const data = JSON.parse(cachedData);
                            if (data.Product && data.Product.length > 0) {
                                console.log("Loaded products from localStorage (admin changes) - Total:", data.Product.length);
                                globalAllProducts = data.Product;
                                
                                // Populate filters and display
                                populateCategoryFilter();
                                populateTypeFilter();
                                populatePriceFilter();
                                displayProducts(globalAllProducts);
                                setupFilterListeners();
                                return;
                            }
                        } catch (err) {
                            console.warn("Error parsing localStorage data, falling back to Database.json:", err);
                        }
                    }

                    // PRIORITY 2: Fall back to Database.json with cache-busting
                    const timestamp = new Date().getTime();
                    const dbUrl = `Backend/Database.json?t=${timestamp}`;

                    fetch(dbUrl)
                        .then((res) => res.json())
                        .then((data) => {
                            globalAllProducts = data.Product;
                            
                            // Populate filters with real data
                            populateCategoryFilter();
                            populateTypeFilter();
                            populatePriceFilter();
                            
                            // Display all products initially
                            displayProducts(globalAllProducts);
                            
                            // Setup filter event listeners
                            setupFilterListeners();
                            
                            console.log("Loaded products from Database.json - Total:", globalAllProducts.length);
                        })
                        .catch((err) => {
                            console.error("Error loading products:", err);
                            ProductList.innerHTML = `<div class="no-results" style="color:red">Error loading products: ${err.message}</div>`;
                        });
                }
            });

            /**
             * Populate Category dropdown with actual categories from data
             */
            function populateCategoryFilter() {
                const categorySelect = document.getElementById('Category');
                // Extract unique categories from products
                const categories = [...new Set(globalAllProducts.map(p => p.Category))];

                // Clear existing placeholder options
                categorySelect.innerHTML = '<option value="">All Categories</option>';

                // Add real categories
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    categorySelect.appendChild(option);
                });
            }

            /**
             * Populate Type dropdown with actual types from data
             */
            function populateTypeFilter() {
                const typeSelect = document.getElementById('Type');
                // Extract unique types from products
                const types = [...new Set(globalAllProducts.map(p => p.Type))];

                // Clear existing placeholder options
                typeSelect.innerHTML = '<option value="">All Types</option>';

                // Add real types
                types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeSelect.appendChild(option);
                });
            }

            /**
             * Populate Price filter with price ranges
             */
            function populatePriceFilter() {
                const priceSelect = document.getElementById('Price');
                const prices = globalAllProducts.map(p => p.Price);
                const min = Math.min(...prices);
                const max = Math.max(...prices);

                // Define price ranges
                const priceRanges = [
                    { label: 'All Prices', value: '' },
                    { label: `$0 - $${Math.ceil(max / 4)}`, value: `0-${Math.ceil(max / 4)}` },
                    { label: `$${Math.ceil(max / 4)} - $${Math.ceil(max / 2)}`, value: `${Math.ceil(max / 4)}-${Math.ceil(max / 2)}` },
                    { label: `$${Math.ceil(max / 2)} - $${max}`, value: `${Math.ceil(max / 2)}-${max}` }
                ];

                priceSelect.innerHTML = '';
                priceRanges.forEach(range => {
                    const option = document.createElement('option');
                    option.value = range.value;
                    option.textContent = range.label;
                    priceSelect.appendChild(option);
                });
            }

            /**
             * Setup event listeners for filters and search
             */
            function setupFilterListeners() {
                // Search input
                const searchInput = document.getElementById('searchKeyword');
                if (searchInput) {
                    searchInput.addEventListener('keyup', applyFilters);
                    searchInput.addEventListener('change', applyFilters);
                }

                // Type filter
                const typeSelect = document.getElementById('Type');
                if (typeSelect) {
                    typeSelect.addEventListener('change', applyFilters);
                }

                // Category filter
                const categorySelect = document.getElementById('Category');
                if (categorySelect) {
                    categorySelect.addEventListener('change', applyFilters);
                }

                // Price filter
                const priceSelect = document.getElementById('Price');
                if (priceSelect) {
                    priceSelect.addEventListener('change', applyFilters);
                }

                // Availability filter
                const availabilitySelect = document.getElementById('Availability');
                if (availabilitySelect) {
                    availabilitySelect.addEventListener('change', applyFilters);
                }
            }

            /**
             * Apply filters and search to product grid
             */
            function applyFilters() {
                const searchKeyword = document.getElementById('searchKeyword')?.value || '';
                const selectedType = document.getElementById('Type')?.value || '';
                const selectedCategory = document.getElementById('Category')?.value || '';
                const selectedPrice = document.getElementById('Price')?.value || '';
                const selectedAvailability = document.getElementById('Availability')?.value || '';

                let filtered = globalAllProducts;

                // Search by keyword
                if (searchKeyword.trim()) {
                    const lowerKeyword = searchKeyword.toLowerCase();
                    filtered = filtered.filter(product =>
                        product.Name.toLowerCase().includes(lowerKeyword) ||
                        product.Description.toLowerCase().includes(lowerKeyword)
                    );
                }

                // Filter by type
                if (selectedType) {
                    filtered = filtered.filter(product => product.Type === selectedType);
                }

                // Filter by category
                if (selectedCategory) {
                    filtered = filtered.filter(product => product.Category === selectedCategory);
                }

                // Filter by price range
                if (selectedPrice) {
                    const [minPrice, maxPrice] = selectedPrice.split('-').map(Number);
                    filtered = filtered.filter(product =>
                        product.Price >= minPrice && product.Price <= maxPrice
                    );
                }

                // Filter by availability
                if (selectedAvailability === 'inStock') {
                    filtered = filtered.filter(product => product.AvailableStock > 0);
                } else if (selectedAvailability === 'outOfStock') {
                    filtered = filtered.filter(product => product.AvailableStock === 0);
                }

                displayProducts(filtered);
            }

            /**
             * Display products in the grid with images
             */
            function displayProducts(products) {
                const container = document.getElementById('productsContainer');

                if (!products || products.length === 0) {
                    container.innerHTML = '<div class="no-results">No products found. Try different filters.</div>';
                    return;
                }

                container.innerHTML = '';
                products.forEach(Product => {
                    const card = `
                    <div class="product-card">
                        <img src="${Product.Image}" class="product-image" alt="${Product.Name}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                        <div class="product-card-body">
                            <h5 class="product-name">${Product.Name}</h5>
                            <p class="product-description">${Product.Description}</p>
                            <div class="product-info">
                                <div class="product-price">$${Product.Price.toFixed(2)}</div>
                                <div class="product-stock ${Product.AvailableStock > 0 ? 'stock-in' : 'stock-out'}">
                                    Stock: ${Product.AvailableStock > 0 ? Product.AvailableStock + ' in stock' : 'Out of Stock'}
                                </div>
                                <div class="product-supplier">Supplier: ${Product.Supplier}</div>
                            </div>
                            <div class="product-actions">
                                <button class="btn-add-cart" data-id="${Product.ProductID}" data-name="${Product.Name}" ${Product.AvailableStock === 0 ? 'disabled' : ''}>
                                    ${Product.AvailableStock === 0 ? 'Out of Stock' : 'Add to Cart'}
                                </button>
                            </div>
                        </div>
                    </div>
                    `;
                    container.insertAdjacentHTML('beforeend', card);
                });

                // Attach add-to-cart handlers
                container.querySelectorAll('.btn-add-cart').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = parseInt(btn.getAttribute('data-id'), 10);
                        const name = btn.getAttribute('data-name');
                        // simple cart in localStorage
                        let cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
                        const existing = cart.find(item => item.productID === id);
                        if (existing) existing.quantity += 1;
                        else cart.push({ productID: id, name: name, quantity: 1 });
                        localStorage.setItem('shoppingCart', JSON.stringify(cart));
                        alert(`"${name}" added to cart`);
                    });
                });
            }

            // Auto-refresh products when page becomes visible (user returns from item-management.html)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    console.log("Page became visible - checking for updated products");
                    const cachedData = localStorage.getItem('store_database');
                    if (cachedData) {
                        try {
                            const data = JSON.parse(cachedData);
                            if (data.Product && data.Product.length > 0) {
                                // Check if data has changed
                                if (JSON.stringify(data.Product) !== JSON.stringify(globalAllProducts)) {
                                    console.log("Products updated in item-management, refreshing view");
                                    globalAllProducts = data.Product;
                                    
                                    // Refresh filters and display
                                    populateCategoryFilter();
                                    populateTypeFilter();
                                    populatePriceFilter();
                                    applyFilters();
                                }
                            }
                        } catch (err) {
                            console.warn("Error checking for updates:", err);
                        }
                    }
                }
            });

            /**
             * Reset localStorage and reload data from Database.json
             */
            window.resetToDatabase = async function() {
                // Double confirmation dialog
                const confirmed = confirm("⚠️ WARNING: This will delete all your changes in localStorage and restore original data from Database.json.\n\nAre you sure you want to continue?");
                
                if (!confirmed) {
                    alert("Reset cancelled");
                    return;
                }

                const doubleConfirmed = confirm("This action cannot be undone. Click OK to confirm:");
                
                if (!doubleConfirmed) {
                    alert("Reset cancelled");
                    return;
                }

                try {
                    // Clear localStorage
                    localStorage.removeItem('store_database');
                    
                    // Re-fetch from Database.json
                    const timestamp = new Date().getTime();
                    const dbUrl = `Backend/Database.json?t=${timestamp}`;
                    
                    const response = await fetch(dbUrl);
                    const data = await response.json();
                    
                    // Update global products
                    globalAllProducts = data.Product;
                    
                    // Refresh the display
                    populateCategoryFilter();
                    populateTypeFilter();
                    populatePriceFilter();
                    displayProducts(globalAllProducts);
                    
                    alert("Data reset successfully!");
                    
                } catch (error) {
                    console.error("Error during reset:", error);
                    alert("Error during reset. Please try again.");
                }
            };

            /**
             * Setup reset button listener for index.html
             */
            const resetBtnIndex = document.getElementById("resetButtonIndex");
            if (resetBtnIndex) {
                resetBtnIndex.addEventListener("click", window.resetToDatabase);
                
                // Add hover effect
                resetBtnIndex.addEventListener("mouseover", function() {
                    this.style.backgroundColor = "#e55039";
                });
                
                resetBtnIndex.addEventListener("mouseout", function() {
                    this.style.backgroundColor = "#ff6b6b";
                });
            }
        </script>
    </body>
</html>
